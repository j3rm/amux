# Product spec example — a copy of this file, renamed to <product>.yml, goes
# in ~/.amux/products/ to enable a per-product container.
#
# The AMUX server reads this on demand via _load_product_spec(name). One
# container per product runs the amux-agent-base image (see agent-container/
# Dockerfile), and every session whose CC_RUNTIME=docker:<product-name>
# spawns tmux inside that container via `docker exec`.
#
# The MINIMUM valid spec is:
#   name: RTG
# Every other field defaults per the loader (see _load_product_spec docstring).

name: RTG                              # matches the filename (RTG.yml)
image: amux-agent-base:latest          # override to a per-product image if needed

# Sessions that belong to this product. Informational: the loader cross-checks
# against each session's CC_RUNTIME, so if a session listed here doesn't have
# CC_RUNTIME=docker:RTG on its env, that's a divergence worth logging.
sessions:
  - RTG-Research
  - RTG-Dispatch
  - RTG-Audit-Codex
  - RTG-Audit-Opus48
  - RTG-AccountingLink
  - RTG-AccountingMigration
  - RTG-AzureBackup
  - RTG-ProSync
  - RTG-ACPSAS
  - RTG-ActAS
  - RTG-ActCloudPortal
  - RTG-ActExporter

# Read-write mounts of host paths into the container. Preserving the same
# target path as source keeps git configs, prompt-embedded paths, and
# absolute-path references in session logs working without translation.
mounts:
  - source: /mnt/gitdata/RemoteTechGroup
    target: /mnt/gitdata/RemoteTechGroup
    mode: rw
  - source: /mnt/gitdata/RTG-AccountingMigration
    target: /mnt/gitdata/RTG-AccountingMigration
    mode: rw

# Explicit read-only cross-product access. Add entries here when Jeremy
# wants an agent in this product to see another product's code as reference
# (springboard pattern). Everything not listed is invisible.
readonly_cross_mounts: []
# Example (once needed):
#   - source: /mnt/gitdata/EmberCRM/Ember_OPS_Web_AngularJS
#     target: /mnt/gitdata/EmberCRM/Ember_OPS_Web_AngularJS
#     mode: ro

# Env vars set via `tmux new-session -e KEY=VALUE` at spawn time. Every
# tmux session in this product inherits them; per-session HOME is added by
# the spawn code, not here.
env: {}
# Example:
#   ZOHO_ORG_RTG: "895770148"

# Where per-session HOMEs live on the host. {session} is replaced with the
# amux session name. Under this directory the loader expects:
#   <pattern>/.claude/         — Claude Code OAuth store, per-session
#   <pattern>/.bashrc          — minimal shell profile
# The container sees this at /homes/<session>/ (bind-mounted by
# ensure_product_container in Phase 2c).
session_home_dir_pattern: /opt/amux/homes/{session}
